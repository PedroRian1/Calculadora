<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Simples</title>
  <meta name="description" content="Calculadora com as quatro operações feita com HTML, CSS e JavaScript puro.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculadora">
    <div class="lcd">
      <div class="history" id="history" aria-hidden="true"></div>
      <div class="value" id="value" role="status" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button class="key fn" data-action="clear" aria-label="Limpar tudo" id="k-clear">AC</button>
      <button class="key fn" data-action="negate" aria-label="Inverter sinal">±</button>
      <button class="key fn" data-action="percent" aria-label="Porcentagem">%</button>
      <button class="key op" data-op="/" aria-label="Dividir">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key op" data-op="*" aria-label="Multiplicar">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key op" data-op="-" aria-label="Subtrair">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key op" data-op="+" aria-label="Somar">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal" aria-label="Vírgula">,</button>
      <button class="key eq" data-action="equals" aria-label="Igual">=</button>
    </div>

    <p class="hint">Também funciona com o teclado: números, + − * /, Enter, Backspace e Esc.</p>
  </main>

  <script src="script.js></script>
</body>
</html>
